[project]
name = "d365fo-system-users"
version = "0.1.0"
description = "Onboard users into Dynamics 365 Finance & Operations from Excel via OData"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1.0,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.10",
]

[project.scripts]
d365fo-users = "app.main:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
